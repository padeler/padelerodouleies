[project]
name = "padelerodouleies"
version = "0.1.0"
description = "Gamified chore & reward web application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "uvicorn[standard]>=0.32.0",
    "coverage>=7.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
